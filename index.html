<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caja Registradora - Restaurante Espacial</title>
    <!-- ENLACE AL ARCHIVO CSS SEPARADO -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- Capas dinámicas del fondo espacial -->
    <canvas id="estrellas"></canvas>
    <div class="nebulosa"></div>

    <!-- 👨‍🚀 ASTRONAUTA (LADO IZQUIERDO, SIN NIEVE) -->
    <div data-js="astro" class="astronaut">
        <div class="head"></div>
        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>
        <div class="body">
            <div class="panel"></div>
        </div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
        <div class="schoolbag"></div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL FORMULARIO -->
    <div class="contenedor">
        <h2>🍕 ¡Pide tu Space Combo! 🍔</h2>
        
        <form id="formularioRestaurante">
            <!-- 1. Plato Principal -->
            <div class="seccion">
                <label for="platoPrincipal">Elige tu plato principal:</label>
                <select id="platoPrincipal" required>
                    <option value="pizza">Pizza Familiar — Q140.00</option>
                    <option value="hamburguesa">Hamburguesa con Queso — Q55.50</option>
                </select>
            </div>
            
            <!-- 2. Tamaño de Bebida -->
            <div class="seccion">
                <label>Tamaño de la Bebida:</label>
                <div class="opciones-inline">
                    <input type="radio" id="bebidaP" name="tamanoBebida" value="pequena" checked>
                    <label for="bebidaP" style="font-weight: normal;">Pequeña (+Q3.00)</label>
                    
                    <input type="radio" id="bebidaM" name="tamanoBebida" value="mediana">
                    <label for="bebidaM" style="font-weight: normal;">Mediana (+Q5.50)</label>
                    
                    <input type="radio" id="bebidaG" name="tamanoBebida" value="grande">
                    <label for="bebidaG" style="font-weight: normal;">Grande (+Q10.00)</label>
                </div>
            </div>
            
            <!-- 3. Acompañamientos / Extras -->
            <div class="seccion">
                <label>¿Deseas agregar extras?</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="extraPapas" value="papas">
                        <label for="extraPapas" style="font-weight: normal;">Papas Fritas (+Q34.50)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="extraHelado" value="helado">
                        <label for="extraHelado" style="font-weight: normal;">Helado de Vainilla (+Q16.80)</label>
                    </div>
                </div>
            </div>
            
            <button type="submit">Calcular Cuenta</button>
        </form>

        <!-- Recibo generado -->
        <div id="reciboRespuesta"></div>
    </div>

    <!-- 📊 PANEL DE CONTROL DE ADMINISTRACIÓN (ANCHO COMPLETO EN LA PARTE INFERIOR) -->
    <div class="panel-admin">
        <h3>📊 Administración de Ventas</h3> 
        <div class="opciones-inline">
            <button type="button" id="btnVerHistorial" class="btn-azul">📋 Ver Historial</button> 
            <button type="button" id="btnBorrarHistorial" class="btn-rojo">🗑️ Limpiar Base de Datos</button>
        </div>
        <div id="tablaHistorial"></div>
    </div>

    <!-- Script para animar estrellas en Canvas -->
    <script>
        const canvas = document.getElementById("estrellas");
        const ctx = canvas.getContext("2d");

        let ancho, alto;
        let estrellas = [];
        const cantidadEstrellas = 180;
        const velocidad = 0.35;

        function ajustarCanvas() {
            ancho = window.innerWidth;
            alto = window.innerHeight;
            const escala = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = ancho * escala;
            canvas.height = alto * escala;
            canvas.style.width = ancho + "px";
            canvas.style.height = alto + "px";
            ctx.setTransform(escala, 0, 0, escala, 0, 0);
        }

        function crearEstrellas() {
            estrellas = [];
            for (let i = 0; i < cantidadEstrellas; i++) {
                estrellas.push({
                    x: Math.random() * ancho,
                    y: Math.random() * alto,
                    radio: Math.random() * 1.8 + 0.4,
                    vx: (Math.random() - 0.5) * velocidad,
                    vy: (Math.random() - 0.5) * velocidad,
                    fase: Math.random() * Math.PI * 2,
                    brillo: Math.random() * 0.6 + 0.4
                });
            }
        }

        function animarEspacio() {
            ctx.clearRect(0, 0, ancho, alto);
            for (const estrella of estrellas) {
                estrella.x += estrella.vx;
                estrella.y += estrella.vy;

                if (estrella.x < 0) estrella.x = ancho;
                if (estrella.x > ancho) estrella.x = 0;
                if (estrella.y < 0) estrella.y = alto;
                if (estrella.y > alto) estrella.y = 0;

                estrella.fase += 0.025;
                const brillo = estrella.brillo * (0.65 + 0.35 * Math.sin(estrella.fase));

                ctx.beginPath();
                ctx.arc(estrella.x, estrella.y, estrella.radio * 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(155, 65, 255, ${brillo * 0.18})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(estrella.x, estrella.y, estrella.radio, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(230, 205, 255, ${brillo})`;
                ctx.fill();
            }
            requestAnimationFrame(animarEspacio);
        }

        ajustarCanvas();
        crearEstrellas();
        animarEspacio();

        window.addEventListener("resize", () => {
            ajustarCanvas();
            crearEstrellas();
        });
    </script>
